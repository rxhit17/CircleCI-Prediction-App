version: 2.1

executors:
  machine-executor:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/repo

# Command to install gcloud, GKE auth plugin, and kubectl
commands:
  setup_gcloud_and_kubectl:
    steps:
      - run:
          name: Install gcloud + GKE auth plugin + kubectl
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl apt-transport-https gnupg

            # Create keyrings directory
            sudo install -m 0755 -d /etc/apt/keyrings

            # Google Cloud SDK key and repo
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | sudo gpg --dearmor -o /etc/apt/keyrings/google-cloud-sdk.gpg

            echo "deb [signed-by=/etc/apt/keyrings/google-cloud-sdk.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
              | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list > /dev/null

            # Kubernetes repo (for kubectl)
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-archive-keyring.gpg

            echo "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main" \
              | sudo tee /etc/apt/sources.list.d/kubernetes.list > /dev/null

            sudo apt-get update
            sudo apt-get install -y google-cloud-cli google-cloud-sdk-gke-gcloud-auth-plugin kubectl

jobs:
  checkout_code:
    executor: machine-executor
    steps:
      - checkout

  build_docker_image:
    executor: machine-executor
    steps:
      - checkout
      - setup_gcloud_and_kubectl
      - run:
          name: Authenticate with Google Cloud
          command: |
            echo "$GCLOUD_SERVICE_KEY" | base64 --decode > gcpkey.json
            gcloud --quiet auth activate-service-account --key-file=gcpkey.json
            gcloud --quiet auth configure-docker us-central1-docker.pkg.dev
      - run:
          name: Build and Push Docker Image
          command: |
            docker --version
            docker build -t us-central1-docker.pkg.dev/$GOOGLE_PROJECT_ID/mlops-app/mlops-app:latest .
            docker push us-central1-docker.pkg.dev/$GOOGLE_PROJECT_ID/mlops-app/mlops-app:latest

  deploy_to_gke:
    executor: machine-executor
    steps:
      - checkout
      - setup_gcloud_and_kubectl
      - run:
          name: Authenticate with Google Cloud
          command: |
            echo "$GCLOUD_SERVICE_KEY" | base64 --decode > gcp-key.json
            gcloud --quiet auth activate-service-account --key-file=gcp-key.json
            gcloud --quiet config set project "$GOOGLE_PROJECT_ID"
            gcloud --quiet auth configure-docker us-central1-docker.pkg.dev
      - run:
          name: Configure GKE Cluster
          command: |
            gcloud container clusters get-credentials "$GKE_CLUSTER" \
              --region "$GOOGLE_COMPUTE_REGION" \
              --project "$GOOGLE_PROJECT_ID"
      - run:
          name: Deploy to GKE
          command: |
            kubectl apply -f kubernetes_dev.yaml

workflows:
  version: 2
  deploy_pipeline:
    jobs:
      - checkout_code
      - build_docker_image:
          requires:
            - checkout_code
      - deploy_to_gke:
          requires:
            - build_docker_image
